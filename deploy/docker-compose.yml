services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "7860"
    volumes:
      - depthflow_runs:/app/runs
      - depthflow_models:/app/models
      - depthflow_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DEPTHFLOW_DOMAIN: ${DEPTHFLOW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  depthflow_runs:
  depthflow_models:
  depthflow_logs:
  caddy_data:
  caddy_config:
